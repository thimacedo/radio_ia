# docker-compose-ntfy.yml
# Coloque este arquivo em qualquer pasta (ex: C:\ntfy\)
# e execute no terminal: docker compose up -d
#
# Após subir:
#   - Web UI: http://localhost:2586
#   - Instale o app "ntfy" no celular (Android/iOS)
#   - No app: Add topic → URL: http://SEU_IP_LOCAL:2586 → Topic: radio-tjrn

services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy_radio_tjrn
    command: serve --cache-file /var/cache/ntfy/cache.db
    restart: unless-stopped
    ports:
      - "2586:80"
    volumes:
      - ntfy_cache:/var/cache/ntfy
    environment:
      - TZ=America/Recife
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep healthy || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  ntfy_cache:
